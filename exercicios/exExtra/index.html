<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manipulando parte espec;ifica do texto</title>
    <style>
      #nome{
        color: #38bdf8;
        font-weight: bold;
        background-color: white;
      } 
      span{
        color: rgb(15, 207, 15);
        background-color: yellow;
      } 
    </style>
</head>
<body>
    <h1>Marcar uma parte do texto</h1>
    <p>A tag &lt;span&gt; é uma tag genérica inline usada para marcar <span>um pedaço específico do texto</span>, sendo muito usada no dia a dia.</p>
    <p>Exemplo de seleção de parte do texto usando o nome <span id="nome">Thiago</span> Antunes</p>
</body>
</html>
