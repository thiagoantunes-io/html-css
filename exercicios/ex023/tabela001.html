<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 400px;
            border-collapse:collapse; /* por padrão tem valor separate*/
            border: 5px solid red;
        }

        tr.linha {
            background-color: aqua;
        }

        td { 
            border: 1px solid black; /*coloco a borda em cada dado da tabela*/
            padding: 8px;
        }

        td.dado {
            background-color: yellow;

        }


    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>

    <!-- HIERARQUIA DE TABELAS (simples) -->
     <!-- TABLE = tabela
            TABLE ROW (tr) = linha da tabela
                TABLE HEADER (th)= cabeçalho de tabela
                TABLE DATA (td)= dado de tabela -->
    <table>
        <tr>
             <th>CABEÇALHO 1 </th>
            <!-- Primeira linha -->
             <td>A1</td>
             <td>B1</td>
             <td>C1</td>
        </tr>
        <tr class="linha">
             <th>CABEÇALHO 2</th>
            <!-- Segunda linha -->
             <td>A2</td>
             <td>B2</td>
             <td>C2</td>
        </tr>
        <tr>
            <!-- Terceira linha -->
             <td>A3</td>
             <td>B3</td>
             <td class="dado">C3</td>
        </tr>
        <tr>
            <!--Quarta linha -->
            <td>A4</td>
            <td class="dado">B4</td>
            <td>C4</td>
        </tr>
    </table>
</body>
</html>
