<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo-classes</title>
    <style>
        body{
            font: normal 1em Arial, Helvetica, sans-serif;
        }
        a{
            font-weight: bold;
            text-decoration: none;
            color: red;
        }
        a:visited{
            color: darkred;
        }
        a:hover{
            text-decoration: underline;
        }

        .especial:hover{
            color: white;
            background-color: black;
            text-decoration: none;
        }
        .especial::before{
            content: '<<';
            font-weight: lighter;
        }
        .especial::after{
            content: '>>';
            font-weight:lighter;
        }
       
    </style>
</head>
<body>
    <h1>Personalizando um link</h1>
    <p>Para aprender HTML5 e CSS3, acesso o <a href="https://gustavoguanabara.github.io/" target="_blank">GitHub do Guanabara</a></p>
    <p>Se quiser conhecer mais sobre os padrões, visite o site do <a href="https://www.w3schools.com/" target="_blank">w3C no Brasil</a></p>
    <p>Para acompanahar os cursos, acesse o site <a class="especial" href="https://www.cursoemvideo.com/" target="_blank">Curso em Vídeo</a></p>
</body>
</html>
