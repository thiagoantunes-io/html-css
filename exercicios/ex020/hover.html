<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Hover</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        div:hover{
            color: red;
        }
        div > p { /* > - significa que o p é filho da div*/
            display: none; /* display:none; - significa "não mostre nada", ou seja, os parágrafos dentro da div ficarão ocultos*/
        }
        div:hover > p {
            display: block; /*vai mostrar o p que está dentro da div*/
            color: white;
            background-color: red;
            width: 300px;
        }   
    </style>
</head>
<body>
    <h1>Exemplo de hover</h1>
    <p>Passe o mouse sobre o texto abaixo</p>
    <div>
        Passe o mouse aqui
        <p>TEXTO ESCONDIDO...</p>
        <p>Fim do exemplo</p>
    </div>
   
</body>
</html>
