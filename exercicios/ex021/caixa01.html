<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>
    <style>
        h1{
            display:inline;
            text-align: justify;
            background-color: lightgray;
            height: 300px;
            width: 300px;
            border-width: 10px;
            border-style: solid;
            border-color: darkgreen;
            /*shorthand - border: 10px solid darKgreen;*/ 

            padding-top: 10px;
            padding-right: 10px;
            padding-bottom: 10px;
            padding-left: 10px;
            /*shorthand - padding: 10px 20px 10px 60px;*/ 

            margin-top: 20px;
            margin-right: 20px;
            margin-bottom: 40px;
            margin-left: 20px;
            /*shorthand - margin: 10px 10px 10px; */
            /*margin: auto; - centraliza a caixa no meio*/
             /*margin: 20px auto 40px auto; - centralizo, mas altero o top e bottom*/
            outline-width: 10px;
            outline-style:dashed;
            outline-color: blue;

            outline: 10px dashed blue;
            /*shorthand - outline: 10px dashed blue;*/ 
        }
        a{
            display: inline-block;
            border-width: 10px;
            border-style:solid;
            border-color: red;
            /*shorthand - border: 10px solid red;*/

            padding: 10px 10px 10px 10px; /* padding: 10px; */

            margin: 10px 10px 10px 10px; /* margin: 10px; */
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona.</p>

</body>
</html>
