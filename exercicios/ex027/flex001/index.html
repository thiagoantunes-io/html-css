<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box (FlexBox)</title>
    <style>
        div.container{
            background-color: lightsalmon;

            display: flex;
        }

        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            
            flex: auto;
        }
    </style>
</head>
<body>
    <div class="container"> <!--Esse é o elemento-pai (flex-container)-->
        <div class="item">A</div> <!-- elemento-filho (flex-item)-->
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
    </div>
    
</body>
</html>
