<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        div{
            padding: 10px;
        }

    </style>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="" method="get" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <div>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome" minlength="5" maxlength="20" required autocomplete="name">
            </div>
            <div>
                <label for="iemail">E-mail</label>
                <input type="email" name="email" id="iemail" required autocomplete="email">
            </div>
            <div>
                <label for="itelefone">Telefone</label>
                <input type="tel" name="telefone" id="itelefone" autocomplete="tel" pattern="^\(\[0-9]{2}\)\[0-9]{4,5}-[0-9]{4}$" required placeholder="(xx)xxxxx-xxxx">
            </div>
        </fieldset>
         <!--
            pattern="^[0-9]{4,5}-[0-9]{4}$" OU pattern="^\d{4,5}-\d{4}$"
            Digitos pode ser \d ou [0-9]
            entre chaves { } indica quantos dígitos são
            ou seja, são 4 a 5 digitos, seguidos de um traço, seguidos de 4 digitos
            \(\[0-9]{2}\)\ ou \(\d{2}\)\- caso eu queira incluir, é a parte da expressão que adiciona dois números entre parênteses. Ex.: (51)
            ]-->
        <!-- Estudar mais sobre RegEx (Expressões Regulares)-->
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
    
</body>
</html>
