<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fomrulário</title>
    <style>
        div{
            margin-bottom: 10px;
        }
        textarea{
            display: block;
            margin-top: 5px;
        }

    </style>
</head>
<body>
    <h1>Exemplo de Formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <div>
            <label for="iestado">Estado:</label>
            <select name="estado" id="iestado" required>
                <option value="" selected>--- Escolha ---</option>
                <optgroup label="Sudeste">
                    <option value="SP">São Paulo</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="MG">Minas Gerais</option>
                </optgroup>

                <optgroup label="Sul">
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="PR">Paraná</option>
                </optgroup>

                <optgroup label="Nordeste">
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="MA">Maranhão</option>
                    <option value="PE">Pernambuco</option>
                </optgroup>
            </select>
        </div>

        <div>
            <label for="iprofissao">Profissão: </label>
            <input type="text" name="profissao" id="iprofissao" list="lista-profissao" placeholder="Escolha" required>
            <datalist id="lista-profissao">
                <option>Médico</option>
                <option>Dentista</option>
                <option>Professor</option>
                <option>Desenvolvedor</option>
                <option>Administrador</option>
                <option value="NUT">Nutricionista</option>
            </datalist>
        </div>

        <div>
            <label for="imensagem">
                Mensagem: <textarea name="mensagem" id="imensagem" cols="30" rows="10" placeholder="Deixe sua mensagem" required></textarea>
            </label>
        </div>

        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
    
</body>
</html>
