<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradiente em CSS</title>
    <style>
        * { /* Configurações globais das CSS*/
            color: white;
            text-align:justify;
        }
        body{
            background-image:linear-gradient(to bottom, #F20587 10%,#F205E2,#960CF2 80%);
            background-attachment:fixed; /*fixa a cor de fundo*/
        }
    </style>
</head>
