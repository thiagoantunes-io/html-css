<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio das Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
            width: 400px;
        }

        th {
            background-color: gray;
            color: white;
            font-weight: lighter;
        }

        th, td {
            border: 1px solid black;
            padding: 5px;
            text-align: center; 
        }

        th.media {
            text-align: left;
        }
        th.exatas-humanas {
            background-color: white;
            color: black;
            font-weight: bold;
        }
        td.materias{
            text-align: left;
        }
        td.nota-media{
            background-color: gray;
            color: white;
        }

    </style>
</head>
<body>
    <h1>Desafio - Tabela 4</h1>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Área</th>
                <th rowspan="2" scope="col">Disciplina</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Média</throw>
            </tr>
            <tr>
                <th scope="col">Nota 1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup" class="exatas-humanas">Exatas</th>
                <td class="materias">Matemática</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
            <tr>
                <td class="materias">Física</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
            <tr>
                <td class="materias">Química</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
            <tr>
                <td class="materias">Biologia</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
            <tr>
                <th colspan="4" scope="row" class="media">Média de Exatas</th>
                <td class="nota-media">0</td>
            </tr>
            <tr>
                <th rowspan="2" scope="rowgroup" class="exatas-humanas">Humanas</th>
                <td class="materias">História</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
            <tr>
                <td class="materias">Geografia</td>
                <td>0</td>
                <td>0</td>
                <td>0</td>
            </tr>
            <tr>
                <th colspan="4" scope="row" class="media">Média de Humanas</th>
                <td class="nota-media">0</td>
            </tr>   
        </tbody>
    </table>
</body>
</html>
