<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box (FlexBox)</title>
    <style>
        div.container{
            background-color: lightsalmon;

            display: flex;
            flex-flow: row nowrap; /*é o padrão*/
        }

        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;

            flex-basis: 300px;
        }
        div#cxA{
            flex-shrink: 0;
            flex-grow: 1;
        }
        div#cxB{
            flex-shrink: 1;
            flex-grow: 1;
        }
        div#cxC{
            flex-shrink: 8;
            flex-grow: 1;
        }
    </style>
</head>
<body>
    <div class="container"> <!--Esse é o elemento-pai (flex-container)-->
        <div class="item" id="cxA">A</div> <!-- elemento-filho (flex-item)-->
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
