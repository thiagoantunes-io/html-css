<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        label {
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de formulário</h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <label for="icor">Cor:
            <input type="color" name="cor" id="icor" value="#00ff00">
        </label>
        <label for="inivel">Nível de Satisfação:
            <input type="range" name="nivel" id="inivel" min="1" max="5" value="2">
        </label>
        <label for="ifoto"> Foto do perfil:
            <input type="file" name="foto" id="ifoto">
        </label>
        <div>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </div>
    </form>
</body>
</html>
