<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box (FlexBox)</title>
    <style>
        div.container{
            background-color: lightsalmon;

            display: flex;
            flex-flow:  row wrap;
        }

        div.item{
            background-color: lightblue;
            border: 1px solid black;
            text-align: center;
            padding: 10px;
            flex-basis: 150px;
            flex
        }
    </style>
</head>
<body>
    <div class="container"> <!--Esse é o elemento-pai (flex-container)-->
        <div class="item">A</div> <!-- elemento-filho (flex-item)-->
        <div class="item">outro conteúdo</div>
        <div class="item">C</div>
        <div class="item">conteúdo um pouco maior</div>
        <div class="item">E</div>
        <div class="item">conteúdo maior ainda que vai ocupar mais espaço</div>
        <div class="item">G</div>
    </div>
</body>
</html>
