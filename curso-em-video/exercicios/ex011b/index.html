<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias Dinâmicas</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Testando a tag &lt;picture&gt; e a tag &lt;source&gt; para redimensionamento de imagens.</p>
    <picture>
        <source media="(max-width:750px)" srcset="imagens/foto-p.JPG" type="image/JPG">
        <source media="(max-width:1050px)" srcset="imagens/foto-m.JPG" type="image/JPG">
        <img src="imagens/foto-g.JPG" alt="imagem padrão (flexível)" title="casa do Mestre Kami">
    </picture>
</body>
</html>
